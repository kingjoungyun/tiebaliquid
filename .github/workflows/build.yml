name: build

# 只做「能编译 + 单测通过」的护栏：不跑 instrumented 测试（起模拟器太慢太贵）。
# 手动触发：Actions → build → Run workflow。
# 引号是故意的：裸 `on:` 会被 YAML 1.1 解析器当成布尔 true（GitHub 自己没问题，但有些
# 本地校验工具会报错）。
"on":
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交直接取消旧跑，省 runner 分钟。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    name: assemble debug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 必须显式指定 packages：该 action 的默认值里还带着 "tools"，
          # 而新版 Android SDK 仓库已经没有这个包（被 cmdline-tools 取代），
          # 用默认值会在 setup 阶段直接 `sdkmanager` exit 1（首次 CI 就是这么挂的）。
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | sed -n '1,25p'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 注意：gradle.properties 里是 -Xmx6144m。GitHub 的 ubuntu runner 内存够；
      # 万一 OOM，把这一步改成 `./gradlew ... -Dorg.gradle.jvmargs=-Xmx4g` 即可（会丢掉
      # gradle.properties 里的 --add-exports，通常只影响 kapt；本工程用 KSP，问题不大）。
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
